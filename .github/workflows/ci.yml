name: Playwright Tests CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "tests/**/*.ts" "tools/**/*.ts" "mcp-server.ts" "playwright.config.ts"

  critical-tests:
    name: Critical Playwright suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run unit tests
        run: npx playwright test tests/unit-tests/

      - name: Run integration tests
        run: npx playwright test tests/integration-tests/

      - name: Run smoke tests
        run: npx playwright test tests/wesendcv.spec.ts tests/vibe.spec.ts

      - name: Verify report artifacts
        run: |
          test -f test-results/results.json
          test -f junit.xml

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            junit.xml
          check_name: Test Results

  extended-tests:
    name: Extended suites (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run validation tests
        run: npx playwright test tests/validation-tests/

      - name: Run mock tests
        run: npx playwright test tests/mock-tests/

      - name: Run interop tests
        run: npx playwright test tests/interop-tests/

      - name: Run performance tests
        run: npx playwright test tests/performance-tests/

      - name: Run security tests
        run: npx playwright test tests/security-tests/

  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@v3.88.16
        with:
          path: ./
          base: HEAD~1
          head: HEAD

  quality-gate:
    name: CI quality gate
    runs-on: ubuntu-latest
    needs: [lint, critical-tests, security-audit, secret-scan]
    steps:
      - name: Confirm quality gate
        run: echo "All blocking quality gates passed."
